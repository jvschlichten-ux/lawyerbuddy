################################################################################
# PHASE 10 — REAL-TIME + NOTIFICATIONS
################################################################################
  - id: phase-10
    name: "Phase 10 — Real-Time + Notifications"
    type: implementation
    description: "Set up Supabase Realtime and push notifications"

    task:
      title: "Real-Time & Notifications — Live Updates & Push Messages"
      description: |
        Set up real-time updates and push notifications for the LawyerBuddy app.

        REAL-TIME (using Supabase Realtime):

        1. In ClientHomeScreen: subscribe to changes in checklist_items for the client's case.
           When the lawyer marks an item complete, the client's progress view updates instantly without refresh.

        2. In ClientMessagesScreen and LawyerMessagesScreen: subscribe to new messages for the current case.
           New messages appear in the chat in real time.

        3. In LawyerDashboardScreen: subscribe to new events created by clients.
           The case card shows a "New activity" badge when a client logs a new event.

        Create a custom hook useRealtimeSubscription(table, filter, callback) in /packages/shared/hooks that:
        - Sets up a Supabase Realtime subscription
        - Automatically unsubscribes on component unmount
        - Handles reconnection on network loss

        PUSH NOTIFICATIONS (using Expo Push Notifications):

        Set up push notification infrastructure:
        - Register device token on login and store in profiles table (new column: expo_push_token)
        - Create a notification service in /backend/src/services/notifications.ts

        Send push notifications in these scenarios:
        1. Client receives a message from their lawyer → "New message from [Lawyer Name]"
        2. Lawyer receives a message from a client → "New message from [Client Name] about [Case Title]"
        3. Lawyer marks a checklist item complete → client receives "Your lawyer updated your case progress"
        4. Client logs a new event → lawyer receives "[Client Name] logged a new event: [Event Title]"

        Notification copy must be available in English and Spanish — check the user's preferred_language field before sending.

        All notifications must be sent via Expo's push notification service (https://exp.host/--/api/v2/push/send) from the backend, never from the client directly.

    depends_on: phase-9
    next_phase: null
    checkpoint: true
    checkpoint_criteria:
      - "Checklist updates appear in real-time on client screen"
      - "Messages deliver instantly"
      - "Push notifications fire for all scenarios"
      - "Notifications in correct language"

